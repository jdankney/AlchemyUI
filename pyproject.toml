[project]
name = "alchemyui"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    # Phase 4: validating and centring reference faces on upload. CPU-only --
    # onnxruntime (not -gpu) keeps the GPU entirely for ComfyUI.
    "insightface>=0.7.3",
    "onnxruntime>=1.20",
    "pillow>=11.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "websockets>=15.0",
]

[project.scripts]
alchemyui = "alchemyui.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["alchemyui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B904"]  # long lines in SQL; Depends() in defaults; raise-from noise

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["env: extra environment variables for the api test client"]
