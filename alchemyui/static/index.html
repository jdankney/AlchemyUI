<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlchemyUI</title>
<meta name="description" content="Self-hosted image generation you can talk to, backed by a local ComfyUI.">
<link rel="icon" href="/assets/alchemyui-favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#090816">
<meta name="color-scheme" content="dark">
<link rel="preload" href="/assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
<!-- No CDN at all. Llamacracy pulls marked/DOMPurify/KaTeX because it renders
     model markdown; there is none here. The fonts (Sora, JetBrains Mono, OFL)
     ship in /assets/fonts, so nothing is fetched from anyone else. -->
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="alc-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a874ff"/><stop offset=".55" stop-color="#d49ad6"/><stop offset="1" stop-color="#f0b85a"/></linearGradient></defs></svg>
<div id="app"></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
